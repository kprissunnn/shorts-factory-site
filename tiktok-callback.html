<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Authorization code</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6;color:#1a1a1a;background:#fff}
code{display:block;padding:12px;background:#f2f2f2;border-radius:6px;word-break:break-all;font-size:15px}
button{margin-top:12px;padding:8px 16px;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<h1>Shorts Factory — authorization</h1>
<p id="msg">Reading the authorization result…</p>
<code id="code" hidden></code>
<button id="copy" hidden>Copy code</button>
<script>
  const p = new URLSearchParams(location.search);
  const msg = document.getElementById("msg");
  if (p.get("code")) {
    const box = document.getElementById("code");
    box.textContent = p.get("code");
    box.hidden = false;
    const btn = document.getElementById("copy");
    btn.hidden = false;
    btn.onclick = () => navigator.clipboard.writeText(p.get("code")).then(() => btn.textContent = "Copied");
    msg.textContent = "Copy this code and paste it into the terminal where tools/tiktok_auth.py is waiting. It expires in a few minutes and is useless without the app secret.";
    history.replaceState(null, "", location.pathname);
  } else {
    msg.textContent = "No code received" + (p.get("error") ? ": " + p.get("error") + " " + (p.get("error_description") || "") : ".");
  }
</script>
</body>
</html>
